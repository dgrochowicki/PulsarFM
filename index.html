<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulsar.fm</title>
<style>
  :root {
    --tile: rgba(196, 221, 255, 0.1);
    --base: rgba(5, 6, 11, 0.55);
    --pop: rgba(20, 23, 32, 0.6);
    --line: rgba(255, 255, 255, 0.09);
    --text: #eef0f6;
    --dim: rgba(238, 240, 246, 0.55);
    --icon: rgba(255, 255, 255, 0.7);
    --accent: #ffcf6e;
    --r: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #05060b; color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; }
  /* Kafelek w kolorze z projektu (#C4DDFF, 10%) na lekko przyciemnionym tle, żeby był czytelny nad obrazem. Bez rozmycia: ono kosztuje przy każdej klatce. */
  .tile { background: linear-gradient(var(--tile), var(--tile)), var(--base); border-radius: var(--r); }
  .ico { width: 32px; height: 32px; padding: 0; border: 0; background: none; border-radius: 10px; color: var(--icon); display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; }
  .ico:hover, .ico[aria-expanded="true"] { background: rgba(255,255,255,0.08); color: #fff; }
  .ico svg, .sq svg { width: 18px; height: 18px; }

  .top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 34px) 38px 0; pointer-events: none; }
  .top h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: 0.1px; }
  .top .status { display: none; color: var(--dim); font-size: 12.5px; margin-top: 4px; max-width: 80vw; }
  .top .status.show { display: block; }

  /* Panel: dane po lewej i pasek na dole. Kliknięcie w obraz chowa całość. */
  .panel { transition: opacity .35s ease; }
  .panel.hidden { opacity: 0; pointer-events: none; }
  .panel.hidden * { pointer-events: none !important; }
  .bar { position: fixed; z-index: 10; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 20px); display: flex; justify-content: center; gap: 8px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .play { flex: 0 0 auto; width: 52px; height: 52px; padding: 0; border: 0; border-radius: var(--r); background: #fff; color: #000; display: grid; place-items: center; cursor: pointer; }
  .play svg { width: 18px; height: 18px; }
  .sq { width: 52px; height: 52px; padding: 0; border: 0; color: var(--icon); display: grid; place-items: center; cursor: pointer; }
  .sq:hover, .sq[aria-expanded="true"] { color: #fff; }

  .station { position: relative; width: 320px; height: 52px; display: flex; align-items: center; gap: 2px; padding: 0 10px 0 0; }
  .st-main { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 18px; border: 0; background: none; text-align: left; cursor: pointer; }
  .st-main .dot { width: 12px; height: 12px; border-radius: 50%; background: #cfe0ff; box-shadow: 0 0 10px #9fc2ff; flex: 0 0 auto; }
  .st-main .t { min-width: 0; }
  .st-main b { display: block; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-main .t div { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Okienka nad paskiem: informacja o pulsarze, tryb danych, styl obrazu. */
  /* Okienka półprzezroczyste: pod spodem widać mapę albo obraz, rozmyte. */
  .pop { position: absolute; bottom: calc(100% + 8px); background: var(--pop); border: 1px solid var(--line); border-radius: var(--r);
    -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); display: none; z-index: 5; }
  .pop.open { display: block; }
  .info-pop { left: 0; width: 100%; }
  .mode-wrap, .style-wrap { position: relative; flex: 0 0 auto; }
  .mode-pop { right: 0; padding: 6px; }
  .modes button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: var(--dim);
    font-size: 14px; font-weight: 500; padding: 9px 12px; border-radius: 11px; cursor: pointer; white-space: nowrap; }
  .modes button.on { background: rgba(255,255,255,0.1); color: var(--text); }
  .modes svg { width: 18px; height: 18px; }
  .style-pop { right: 0; padding: 10px; width: 300px; max-width: calc(100vw - 20px); }
  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .styles button { border: 0; background: rgba(255,255,255,0.04); color: var(--dim); font-size: 12px; font-weight: 500; padding: 10px 4px 8px;
    border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .styles button.on { background: rgba(255,255,255,0.12); color: var(--text); }
  .styles svg { width: 24px; height: 24px; }
  .style-pop .note { color: var(--dim); font-size: 12px; margin: 10px 4px 2px; }

  /* Informacja o pulsarze: ta sama w okienku nad stacją i na mapie. */
  .info { padding: 16px 18px 18px; font-size: 12px; }
  .info-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .info-head b { font-size: 14px; font-weight: 500; }
  .info .tag { color: rgba(238,240,246,0.8); margin-top: 3px; }
  .info .ico { margin: -6px -8px 0 0; }
  .info dl { display: grid; grid-template-columns: 100px 1fr; gap: 3px 0; margin: 14px 0 0; }
  .info dt { color: var(--dim); }
  .info dd { margin: 0; color: var(--text); font-variant-numeric: tabular-nums; }
  .info .about { margin: 14px 0 0; color: rgba(238,240,246,0.8); }
  .info .how { margin-top: 12px; color: var(--dim); }
  .info .how span { display: block; color: rgba(238,240,246,0.8); margin-bottom: 2px; }

  /* Dane: kolumna po lewej. */
  .stats { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); width: 110px; display: grid; gap: 6px; }
  .stat { padding: 13px 16px 12px; text-align: left; min-width: 0; }
  .stat .v { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .v small { font-size: 11px; font-weight: 400; color: var(--dim); margin-left: 3px; }
  .stat .k { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .stat .r { font-size: 11px; line-height: 1.2; color: rgb(239,230,210); opacity: .9; margin-top: 1px; }
  .stat .r.off { opacity: .35; }
  .stat .short { display: none; }

  .devbox { position: fixed; right: 16px; top: calc(env(safe-area-inset-top) + 80px); width: 260px; max-height: 70vh; overflow: auto; padding: 10px; }
  .more { display: flex; gap: 8px; flex-wrap: wrap; }
  .ghost { flex: 1; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--text); font-size: 12.5px; cursor: pointer; }
  .ghost:active { background: rgba(255,255,255,0.08); }
  .sliders { display: none; margin-top: 10px; gap: 8px; }
  .sliders.open { display: grid; }
  .sliders label { display: grid; grid-template-columns: 60px 1fr 44px; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .sliders output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .err { color: #ff9b8a; }
  body:not(.dev) .dev-only { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Mapa pulsarów */
  .sheet { position: fixed; inset: 0; z-index: 5; background: #05060b;
    display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 20px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .sheet.open { opacity: 1; pointer-events: auto; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-left: 18px; }
  .sheet-head b { font-size: 16px; font-weight: 500; }
  .sheet-actions { display: flex; gap: 8px; align-items: center; }
  .auto-toggle { height: 36px; padding: 0 14px; border: 0; border-radius: 12px; color: var(--icon); font-size: 13px; cursor: pointer; }
  .auto-toggle.on { background: #fff; color: #000; }
  .sheet-head .sq { width: 36px; height: 36px; border-radius: 12px; }
  .sheet-head { position: relative; z-index: 1; }
  /* Na mapie zostaje pasek, okienko informacji stoi nad nim, dane się chowają. */
  body.map .stats { display: none; }
  .ico.on { background: rgba(255,255,255,0.12); color: #fff; }
  .skywrap { position: absolute; inset: 0; }
  #sky { display: block; touch-action: manipulation; cursor: pointer; }

  /* Telefon: dane w jednym rzędzie nad paskiem, styl obrazu w prawym górnym rogu. */
  @media (max-width: 640px) {
    .top { padding: calc(env(safe-area-inset-top) + 18px) 20px 0; }
    .bar { left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px); gap: 6px; }
    .play, .sq { width: 48px; height: 48px; }
    .station { flex: 1; width: auto; min-width: 0; height: 48px; padding-right: 6px; }
    .st-main { padding-left: 14px; gap: 10px; }
    .style-wrap { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 10px; }
    .style-wrap .sq { width: 44px; height: 44px; }
    .style-pop { top: calc(100% + 8px); bottom: auto; }
    .info-pop { position: fixed; left: 10px; right: 10px; width: auto; bottom: calc(env(safe-area-inset-bottom) + 66px); }
    .stats { left: 10px; right: 10px; top: auto; bottom: calc(env(safe-area-inset-bottom) + 64px); transform: none; width: auto; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .stat { padding: 8px 6px 7px; border-radius: 14px; }
    .stat .v { font-size: 14px; }
    .stat .v small { margin-left: 1px; font-size: 9px; }
    .stat.wide .v small { display: none; }
    .stat .k, .stat .r { font-size: 10.5px; }
    .stat .long { display: none; }
    .stat .short { display: inline; }
    .devbox { top: auto; bottom: 150px; left: 10px; right: 10px; width: auto; max-height: 40vh; }
    .sheet { padding-left: 10px; padding-right: 10px; }
    .sheet-head { padding-left: 10px; }
    body.map .sheet-actions { margin-right: 52px; } /* miejsce na ikonę stylu, która zostaje w rogu */
  }
  @media (max-width: 360px) { .stats { gap: 4px; } .stat { padding: 8px 4px 7px; } .stat .k, .stat .r { font-size: 9.5px; } .stat .v small { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <h1>Pulsar.fm</h1>
  <div class="status" id="status" aria-live="polite">Loading data…</div>
</div>

<div class="panel" id="panel">
  <div class="stats">
    <div class="stat tile" title="The last 16 minutes of solar wind set the notes of the melody and the chords"><div class="v"><span id="vWind">–</span><small>km/s</small></div><div class="k">Solar wind</div><div class="r">Melody</div></div>
    <div class="stat tile" title="The denser the wind, the more notes in the melody and the more small drum hits"><div class="v"><span id="vDens">–</span><small>p/cm³</small></div><div class="k">Density</div><div class="r">Rhythm</div></div>
    <div class="stat tile" title="Bz below −2 nT: a dark scale and a low bass; above 0: a bright scale"><div class="v"><span id="vBz">–</span><small>nT</small></div><div class="k">Bz</div><div class="r" id="rBz">Scale</div></div>
    <div class="stat tile" title="From Kp 4, quiet high tones play above the chords, louder as Kp rises"><div class="v" id="vKp">–</div><div class="k">Kp</div><div class="r" id="rKp"><span class="long">High tones</span><span class="short">Highs</span></div></div>
    <div class="stat tile" title="A new flare from class C: a boom like in a film trailer (big drum, low boom, at M and X a braam chord)"><div class="v" id="vX">–</div><div class="k">Solar flare</div><div class="r" id="rX">Boom</div></div>
  </div>

  <div class="bar">
    <button class="play" id="play" type="button" aria-label="Play" title="Play"></button>
    <div class="station tile">
      <button class="st-main" id="stMain" type="button" title="Choose a pulsar">
        <span class="dot" id="psrDot"></span>
        <span class="t"><b id="psrName">PSR B0329+54</b><div id="psrLine"></div></span>
      </button>
      <button class="ico" id="infoBtn" type="button" aria-haspopup="true" aria-expanded="false" title="About this pulsar" aria-label="About this pulsar"></button>
      <button class="ico" id="psrBtn" type="button" title="Choose a pulsar" aria-label="Choose a pulsar"></button>
      <div class="pop info-pop" id="infoPop"></div>
    </div>
    <div class="mode-wrap">
      <button class="sq tile" id="modeBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <div class="pop mode-pop" id="modePop">
        <div class="modes" id="modes">
          <button data-mode="live" class="on">Live</button>
          <button data-mode="replay">Replay 3 h</button>
          <button data-mode="storm" class="dev-only">Storm</button>
        </div>
      </div>
    </div>
    <div class="style-wrap">
      <button class="sq tile" id="styleBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <div class="pop style-pop" id="stylePop">
        <div class="styles" id="styles">
          <button data-style="ridges" class="on">Ridges</button>
          <button data-style="waves">Waves</button>
          <button data-style="cymatics">Cymatics</button>
          <button data-style="color">Colour</button>
          <button data-style="bauhaus">Bauhaus</button>
          <button data-style="scope">Oscilloscope</button>
        </div>
        <div class="note" id="styleNote"></div>
      </div>
    </div>
  </div>

  <div class="devbox tile dev-only">
    <div class="more">
      <button class="ghost" id="flare">Wywołaj rozbłysk</button>
      <button class="ghost" id="toggleSliders">Steruj ręcznie</button>
      <div id="layers"></div>
    </div>
    <div class="sliders" id="sliders">
      <label>Wiatr <input type="range" id="sWind" min="280" max="900" step="5"><output id="oWind"></output></label>
      <label>Gęstość <input type="range" id="sDens" min="0.5" max="30" step="0.5"><output id="oDens"></output></label>
      <label>Bz <input type="range" id="sBz" min="-25" max="15" step="0.5"><output id="oBz"></output></label>
      <label>Kp <input type="range" id="sKp" min="0" max="9" step="0.33"><output id="oKp"></output></label>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-head">
    <b>Choose a pulsar</b>
    <div class="sheet-actions">
      <button class="auto-toggle tile" id="autoPulsar" type="button" aria-pressed="false" title="Pick the pulsar highest above you">Auto</button>
    </div>
  </div>
  <div class="sr" id="autoStatus" aria-live="polite">Auto choice off.</div>
  <div class="skywrap"><canvas id="sky"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script src="data/sky.js"></script>

const NOTE_PL = { "C#": "Cis", "D#": "Dis", "F#": "Fis", "G#": "Gis", "A#": "B", B: "H" };

// Wolny pulsar ustala tempo, szybki tonację i dokładne strojenie całego utworu.
function musicFor(p) {
  if (p.P >= 0.2) return { kind: "tempo", tr: 0, cents: 0, f: 1 / p.P };
  const f = 1 / p.P;
  const midi = 69 + 12 * Math.log2(f / 440);
  const root = Math.round(midi);
  let tr = (((root - 62) % 12) + 12) % 12; // względem D
  if (tr > 6) tr -= 12;
  const name = NOTE_NAMES[((root % 12) + 12) % 12];
  return { kind: "tone", tr, cents: (midi - root) * 100, f, note: (NOTE_PL[name] || name) + (f < 30 ? "" : Math.floor(root / 12) - 1) };
}
// Tempo z błysków: wolno je tylko mnożyć lub dzielić przez 2, jak oktawy, żeby rytm był prawdziwym podziałem błysków.
function bpmFor(p) {
  const floor = GENRES[p.genre].tempoFloor || 80;
  let bpm = 60 / p.P;
  while (bpm < floor) bpm *= 2;
  while (bpm >= floor * 2) bpm /= 2;
  return bpm;
}
// Wszystko, co pulsar ustala w muzyce, opisane tak samo dla każdego. Liczby idą z tego, co naprawdę gra.
function psrFacts(p) {
  const m = musicFor(p), bpm = bpmFor(p), perMin = 60 / p.P, ratio = perMin / bpm;
  const per = p.P >= 0.5 ? fmt(p.P, 2) + " s" : p.P >= 0.01 ? fmt(p.P * 1000, 1) + " ms" : fmt(p.P * 1000, 2) + " ms";
  const each = Math.round(ratio), hits = Math.round(1 / ratio);
  const nth = (n) => n + ([11, 12, 13].includes(n % 100) ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
  const beat = ratio < 0.75 ? `${hits} beats per flash` : each === 1 ? "every flash is a beat" : `every ${nth(each)} flash is a beat`;
  const bpmTxt = (Math.round(bpm * 10) / 10) % 1 ? fmt(bpm, 1) : fmt(bpm, 0);
  const rate = fmt(1 / p.P, p.P >= 0.01 ? 1 : 0);
  const key = m.kind === "tempo" ? "D" : m.note.replace(/\d/, ""), c = Math.round(m.cents), cents = `${c >= 0 ? "+" : "−"}${Math.abs(c)}`;
  const keySub = m.kind === "tempo" ? "fixed" : `${fmt(m.f, 1)} Hz, ${cents} c`;
  const keyWhy = m.kind === "tempo" ? `The key stays D: at ${rate} flashes per second the pulsar is a rhythm, not a pitch.`
    : m.f < 20 ? `It flashes ${rate} times a second, too low to hear as a pitch, but a few octaves up the nearest note is ${m.note.replace(/\d/, "")}, so that's the key.`
    : `The pulsar flashes ${rate} times a second, so it sounds like a ${fmt(m.f, 1)} Hz tone. The nearest note is ${m.note}, so that's the key, tuned ${cents} cents.`;
  return { per, bpm: bpmTxt, beat, key, keySub, why: `${bpmTxt} BPM: ${beat}. ${keyWhy}` };
}

function xrayClass(flux) {
  if (!(flux > 0)) return { letter: "–", level: 0 };
  const classes = [["A", 1e-8], ["B", 1e-7], ["C", 1e-6], ["M", 1e-5], ["X", 1e-4]];
  let c = classes[0];
  for (const k of classes) if (flux >= k[1]) c = k;
  const n = flux / c[1];
  return { letter: c[0] + (n >= 10 ? Math.round(n) : n.toFixed(1)), level: classes.indexOf(c) };
}

// Nowy rozbłysk: ostatni odczyt ma klasę od C wzwyż i wyższą niż wszystko z poprzednich 3 godzin.
// Okno, a nie maksimum z całej sesji, żeby po jednym M radio nie czekało na X; tło klasy C nie uderza.
const FLARE_WINDOW_MS = 3 * 3600 * 1000;
function newFlareLevel(rows) {
  const last = rows[rows.length - 1], level = xrayClass(last.flux).level;
  const from = Date.parse(last.time_tag) - FLARE_WINDOW_MS;
  const before = rows.slice(0, -1).filter((r) => Date.parse(r.time_tag) >= from);
  return level >= 2 && before.every((r) => xrayClass(r.flux).level < level) ? level : 0;
}

// Ostatnie 3 godziny z NOAA po 3 minuty: z nich powstają pierwsze fale.
function liveHistory(windRows, magRows, xrayRows, kp) {
  const minute = (r) => r.time_tag.slice(0, 16);
  const bz = new Map(magRows.filter((r) => r.active && r.bz_gsm != null).map((r) => [minute(r), Number(r.bz_gsm)]));
  const xr = new Map(xrayRows.map((r) => [minute(r), xrayClass(r.flux).level]));
  const rows = windRows.filter((r) => r.active && r.proton_speed != null).slice(0, 180).reverse(), out = [];
  for (let i = 0; i + 3 <= rows.length; i += 3) {
    const part = rows.slice(i, i + 3), peak = Math.max(...part.map((r) => xr.get(minute(r)) || 0));
    out.push({ wind: Number(part[0].proton_speed), dens: Number(part[0].proton_density ?? 4), bz: bz.get(minute(part[0])) ?? 0, kp: kp ?? 2, flare: peak >= 3 ? peak : 0 });
  }
  return out;
}

async function getJSON(url) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const newestActive = (rows, key) => rows.find((r) => r.active && r[key] != null) || rows.find((r) => r[key] != null);

async function fetchLive() {
  try {
    const [wind, mag, kp, xr] = await Promise.allSettled([
      getJSON(SWPC + "/json/rtsw/rtsw_wind_1m.json"),
      getJSON(SWPC + "/json/rtsw/rtsw_mag_1m.json"),
      getJSON(SWPC + "/products/noaa-planetary-k-index.json"),
      getJSON(SWPC + "/json/goes/primary/xrays-6-hour.json"),
    ]);
    if (wind.status !== "fulfilled" || mag.status !== "fulfilled") throw new Error("brak RTSW");
    const w = newestActive(wind.value, "proton_speed");
    const m = newestActive(mag.value, "bz_gsm");
    const out = { wind: Number(w.proton_speed), dens: Number(w.proton_density ?? 4), bz: Number(m.bz_gsm), time: new Date(w.time_tag + "Z") };
    if (kp.status === "fulfilled") { const last = kp.value[kp.value.length - 1]; out.kp = Number(last.Kp ?? last[1]); }
    if (xr.status === "fulfilled") {
      const long = xr.value.filter((r) => r.energy === "0.1-0.8nm" && r.flux > 0);
      if (long.length) {
        const last = long[long.length - 1];
        out.xray = Number(last.flux); out.xrayTag = last.time_tag; out.flareLevel = newFlareLevel(long);
      }
    }
    liveOK = true; lastLive = out;
    const tail = wind.value.filter((r) => r.active && r.proton_speed != null).slice(0, 17).reverse().map((r) => Number(r.proton_speed));
    if (tail.length === 17) windTail = tail;
    if (!WAVES.seeded) {
      const long = xr.status === "fulfilled" ? xr.value.filter((r) => r.energy === "0.1-0.8nm" && r.flux > 0) : [];
      seedWaves(liveHistory(wind.value, mag.value, long, out.kp));
    }
    return out;
  } catch (e) { liveOK = false; return null; }
}

function applyLive(d) {
  target.wind = d.wind; target.dens = d.dens; target.bz = d.bz;
  if (Number.isFinite(d.kp)) target.kp = d.kp;

    if (xrayTag && d.xrayTag !== xrayTag && d.flareLevel) triggerFlare(d.flareLevel);
    xrayTag = d.xrayTag;
  }
}

  else if (mode === "live") s.innerHTML = `<span class="err">Can't reach NOAA.</span> Playing the 18 Oct 2026 recording.`;

  s.classList.toggle("show", !!s.querySelector(".err"));

const SCALES = {
  lydian: [0, 2, 4, 6, 7, 9, 11], major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10],
  aeolian: [0, 2, 3, 5, 7, 8, 10], phrygian: [0, 1, 3, 5, 7, 8, 10], mixo: [0, 2, 4, 5, 7, 9, 10],

const midiOf = (root, scale, deg) => {
  const n = scale.length, o = Math.floor(deg / n), i = ((deg % n) + n) % n;
  return root + o * 12 + scale[i];
};

const chordDegs = (d, n = 3) => Array.from({ length: n }, (_, k) => d + 2 * k);
const chance = (p) => Math.random() < p;
const pick = (a) => a[Math.floor(Math.random() * a.length)];

// Motyw: krótka fraza, która się powtarza i co kilka taktów lekko zmienia. Dzięki temu słychać melodię, a nie deszcz nut.
class Motif {
  constructor(len, range, fill) { this.len = len; this.range = range; this.gen(fill); }
  gen(fill) {
    let d = Math.round((this.range[0] + this.range[1]) / 2);
    this.steps = [];
    for (let i = 0; i < this.len; i++) {
      if (i === 0 || chance(fill)) { d = clamp(d + pick([-2, -1, -1, 0, 1, 1, 2, 3]), this.range[0], this.range[1]); this.steps.push(d); }
      else this.steps.push(null);
    }
  }
  mutate(fill) {
    const i = 1 + Math.floor(Math.random() * (this.len - 1));
    if (chance(fill)) {
      const prev = this.steps.slice(0, i).reverse().find((x) => x != null) ?? this.range[0];
      this.steps[i] = clamp(prev + pick([-2, -1, 1, 2]), this.range[0], this.range[1]);
    } else this.steps[i] = null;
  }
  at(i) { return this.steps[i % this.len]; }
}
const rhythm = (len, fill, must = []) => Array.from({ length: len }, (_, i) => must.includes(i) || chance(fill));

// Ostatnie 17 minut wiatru: 16 kroków melodii i pomiar przed nimi, żeby znać zmianę w pierwszym kroku.
function windValues() {
  if (mode === "live" && windTail.length === 17) return windTail;
  if (mode === "replay" || (mode === "live" && !lastLive)) return Array.from({ length: 17 }, (_, i) => SNAP.wind[(replayIdx - 16 + i + SNAP.wind.length) % SNAP.wind.length]);
  return null;
}
// Wysokości melodii: każdy pomiar to jeden krok frazy.
function windDegrees(lo, hi) {
  const all = windValues();
  if (!all) return null;
  const w = all.slice(1);
  const min = Math.min(...w), max = Math.max(...w), range = Math.max(max - min, 6), mid = (min + max) / 2;
  return w.map((v) => clamp(Math.round(lo + ((v - mid) / range + 0.5) * (hi - lo)), lo, hi));
}

function vol(node, db) { node.volume.value = db; return node; }

// Próbki z audio/. Nazwy nut to prawdziwe wysokości plików.
const sampler = (files, release) => new Tone.Sampler({ urls: Object.fromEntries(Object.entries(files).map(([note, f]) => [note, f + ".m4a"])), baseUrl: "audio/", release });
// Barwa pada z danych: 16 ostatnich minut wiatru to głośności 16 kolejnych alikwotów.
// Zmiana wiatru w danym kroku, km/s na minutę. Od niej zależy, czy nuta w ogóle zabrzmi.
function windChange(s) {
  const w = windValues();
  return w ? Math.abs(w[s + 1] - w[s]) : 0;
}
// Kroki frazy z n największymi zmianami wiatru.
function windPeaks(n) {
  return new Set(Array.from({ length: 16 }, (_, i) => i).sort((a, b) => windChange(b) - windChange(a)).slice(0, n));
}
// Jedna melodia dla wszystkich gatunków: te same dane dają te same nuty, nowy pomiar je zmienia. 16 kroków, stopnie 0–7 lub null,
// małe skoki, żeby płynęła, nuty na miejscach największych zmian wiatru. Instrument, rytm, tempo i rejestr należą do gatunku.
function windMelody() {
  const deg = windDegrees(0, 7);
  if (!deg) return null;
  const peaks = windPeaks(Math.round(lerp(6, 10, E.busy())));
  let cur = deg[0];
  return deg.map((d, i) => { cur = clamp(d, cur - 2, cur + 2); return peaks.has(i) ? cur : null; });
}
// Akord z wiatru: każda z 4 części frazy to średnia z 4 minut, wybiera stopień od ciemnego (mały wiatr) do jasnego.
const WIND_CHORDS = [5, 3, 0, 2, 4];
function windChord(part) {
  const w = windDegrees(0, WIND_CHORDS.length - 1);
  return w ? WIND_CHORDS[Math.round((w[part * 4] + w[part * 4 + 1] + w[part * 4 + 2] + w[part * 4 + 3]) / 4)] : null;
}
function windPartials() {
  const wind = windDegrees(0, 100);
  return Array.from({ length: 16 }, (_, i) => (i === 0 ? 1 : (0.15 + (wind ? wind[i] / 100 : 0.5) * 0.85) / (i + 1)));
}

  // B0329+54: ambient z arpeggio, ale motywem zamiast losowych nut.

  // Geminga: połowa jej rytmu to 126 BPM, czyli tempo techno. Błyski pulsara grają hi-hat na ósemkach.
  techno: {
    label: "Minimal techno", scales: ["dorian", "phrygian"],
    // Każdy pulsar ma mieć inne instrumenty. Deep: krótkie akordy z prostokątów jako akcent, tło, melodia brzmieniem akordów.
    // Techno: tło z długich, płynących akordów, melodia na organach, szepty.
    make(B, deep = false) {
      const kick = vol(new Tone.MembraneSynth({ pitchDecay: 0.045, octaves: 6, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 } }), -6).connect(B.lim);
      const hf = new Tone.Filter(8000, "highpass").connect(B.lim);
      const hat = vol(new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.04, sustain: 0 } }), -24).connect(hf);
      const ohat = vol(new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.18, sustain: 0 } }), -22).connect(hf);
      const cf = new Tone.Filter({ frequency: 1600, type: "bandpass", Q: 1.2 }).connect(B.rev);
      const clap = vol(new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.002, decay: 0.12, sustain: 0 } }), -14.5).connect(cf);
      // Bas: głęboki sinus (sub) plus cichy, filtrowany piłokształtny na wierzchu, żeby był słyszalny na małych głośnikach.
      const subSat = new Tone.Chebyshev(3).connect(B.lim);
      subSat.wet.value = 0.15;
      const bass = vol(new Tone.MonoSynth({ oscillator: { type: "sine" }, filter: { type: "lowpass", rolloff: -24, Q: 0.5 }, envelope: { attack: 0.006, decay: 0.3, sustain: 0.55, release: 0.18 }, filterEnvelope: { attack: 0.01, decay: 0.2, sustain: 1, release: 0.2, baseFrequency: 220, octaves: 0.5 } }), -12).connect(subSat);
      const stab = deep ? vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsquare", count: 2, spread: 15 }, envelope: { attack: 0.003, decay: 0.12, sustain: 0, release: 0.15 } }), -2).connect(B.delay) : null;
      const melF = deep ? null : new Tone.Filter(3500, "lowpass").connect(B.delay);
      const melody = deep
        ? vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsquare", count: 2, spread: 15 }, envelope: { attack: 0.003, decay: 0.12, sustain: 0, release: 0.15 } }), -14).connect(B.delay)
        : vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "custom", partials: [1, 0.7, 0.5, 0.25, 0.15, 0.1] }, envelope: { attack: 0.004, decay: 0.18, sustain: 0.15, release: 0.1 } }), -19).connect(melF); // organy
      // Szepty: szum przez wąski filtr, który w każdej sylabie stoi gdzie indziej. Imitacja, nie głos.

      const whisper = deep ? null : vol(new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.012, decay: 0.09, sustain: 0 } }), -6).connect(whF);
      // Tło: gruba piła z wolno ruchomym filtrem, przyciszana stopą, żeby pompowała. Ma stałą głośność i pasmo, na które ucho jest czułe, więc musi być dużo ciszej, niż wskazują szczyty.
      const pump = new Tone.Gain(1).connect(B.rev), pump2 = new Tone.Gain(1).connect(B.lim);
      const plF = new Tone.Filter({ type: "lowpass", frequency: 800, Q: deep ? 2 : 3, rolloff: -24 });
      plF.connect(pump); plF.connect(pump2);
      const plLfo = new Tone.LFO(deep ? { frequency: "16m", min: 350, max: 2200 } : { frequency: "8m", min: 300, max: 2400 }).connect(plF.frequency).start();
      const plama = vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 3, spread: deep ? 32 : 20 }, envelope: { attack: deep ? 0.6 : 1.2, decay: 0.5, sustain: 0.8, release: deep ? 1.5 : 3 } }), deep ? -42 : -43).connect(plF);
      const plProg = [0, 0, 5, 3];
      let flash = 0, inBreakdown = false, chordDeg = 0, whKey = null, whBars = 0;
      const melLo = deep ? 4 : 0, melHi = deep ? 12 : 7;
      const leadMotif = new Motif(16, [melLo, melHi], 0.4);
      const bassLine = new Motif(4, [0, 4], 0.8);
      let stabR = rhythm(16, 0.18, [3]);
      return {
        mix: { Stopa: kick, "Hi-hat": hat, "Otwarty hi-hat": ohat, Klaps: clap, Bas: bass, ...(deep ? { Akordy: stab, "Tło": plama, Melodia: melody } : { "Tło": plama, Melodia: melody, Szepty: whisper }) },
        nodes: [kick, hf, hat, ohat, cf, clap, subSat, bass, stab, melody, melF, whF, whisper, pump, pump2, plF, plLfo, plama].filter(Boolean), tun: [bass, stab, melody, kick, plama].filter(Boolean),
        step(t, s, bar) {

            chordDeg = windChord(part) ?? plProg[part];
            plama.releaseAll(t); plama.triggerAttack(chordDegs(chordDeg, 4).map((x) => E.n(x, -1)), t + 0.02, 0.7);
          }
          inBreakdown = breakdown;
          if (!breakdown && s === 0) Tone.Draw.schedule(() => vis.beat(), t);
          if (s % 4 === 2) ohat.triggerAttackRelease("16n", t, 0.6);

            if (!deep) melF.frequency.setValueAtTime(3500 * (0.6 + E.bright() * 0.8), t);

    },
  },

  // B0950+08: 118,6 BPM. To samo co techno, ale niesie je akord, nie acid.

    label: "Deep", scales: ["dorian", "phrygian"],

  // Vela: 11 błysków na sekundę słychać jako warkot. Przy 84 BPM to dokładnie trzydziestodwójki.
  glitch: {
    label: "Glitch", scales: ["phrygian", "phrygian"],
    make(B) {
      const crush = new Tone.Distortion(0.85).connect(B.delay);
      const click = vol(new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.006, sustain: 0 } }), -22).connect(crush);
      const blip = vol(new Tone.FMSynth({ harmonicity: 7, modulationIndex: 22, envelope: { attack: 0.001, decay: 0.06, sustain: 0, release: 0.05 } }), -26).connect(crush);
      const sub = vol(new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 4, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 } }), -14).connect(B.lim);
      const pf = new Tone.AutoFilter(0.07, 200, 3).connect(B.rev).start();
      const pad = vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fmsquare" }, envelope: { attack: 2, decay: 1, sustain: 0.6, release: 4 } }), -32).connect(pf);
      const motif = new Motif(16, [7, 14], 0.3);
      let clicks = rhythm(16, 0.35, [0, 6]), subs = rhythm(16, 0.12, [0]);

        mix: { Trzaski: click, Piknięcia: blip, Sub: sub, Pad: pad },
        nodes: [crush, click, blip, sub, pf, pad], tun: [blip, sub, pad],
        step(t, s, bar) {

  // Krab: 30 Hz to najniższy bas. Dub: głęboki bas, akordy na słabą część taktu w długim echu, uderzenie na trzy.
  dub: {
    label: "Dub", scales: ["dorian", "aeolian"],
    make(B) {
      const echo = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.62, wet: 0.55 }).connect(B.rev);
      const ef = new Tone.Filter(1800, "lowpass").connect(echo);
      const skank = vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "square" }, envelope: { attack: 0.002, decay: 0.12, sustain: 0, release: 0.1 } }), -24).connect(ef);

      const rim = vol(new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.04, sustain: 0 } }), -16).connect(rf);

          const mel = windMelody(), mi = (bar % 2) * 8 + (s >> 1), d = mel ? (s % 2 === 0 && mel[mi] != null ? mel[mi] - 7 : null) : line.at(s);

  // J0437: ton F, a co 64. błysk to uderzenie: 162,8 BPM, tempo liquid drum and bass. Szybki rytm pod wolnym chórem i szkłem.
  glass: {
    label: "Liquid drum and bass", tempoFloor: 100, pulseBurst: true, scales: ["lydian", "aeolian"],
    make(B) {
      const vf = new Tone.Filter({ frequency: 900, type: "bandpass", Q: 0.8 }).connect(B.rev);

      const hat = vol(sampler({ C3: "dnb-hat-1", D3: "dnb-hat-2" }, 0.03), -25).connect(B.lim);
      const ohat = vol(sampler({ C3: "dnb-ohat" }, 0.1), -24).connect(B.lim);
      const shaker = vol(sampler({ C3: "dnb-shaker" }, 0.03), -26).connect(B.lim);
      // Bas: niski i łagodny, miękkie wejście i poślizg między nutami.
      const sub = vol(new Tone.Synth({ portamento: 0.07, oscillator: { type: "custom", partials: [1, 0.12] }, envelope: { attack: 0.035, decay: 0.15, sustain: 0.85, release: 0.2 } }), -11).connect(B.lim);
      // Tło melodyczne: to samo miękkie brzmienie co chór, wolno idzie po dźwiękach akordu.
      const pad2 = vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsine", count: 3, spread: 18 }, envelope: { attack: 0.5, decay: 1, sustain: 0.5, release: 3 } }), -25).connect(vf);
      const motif = new Motif(16, [5, 12], 0.4);
      // Stopa prosta i cicha, łamie się werbel: co drugi takt mocne uderzenie spóźnia się o ósemkę, a między nimi grają ciche. Pozycje to szesnastki.
      const BREAK = [{ kick: [0, 10], snare: [4, 12], ghost: [7, 9, 15] }, { kick: [0, 10], snare: [4, 14], ghost: [7, 9, 12, 15] }];
      // Bas na dwa takty: buum buum bum bum bum buum, pozycja w szesnastkach i długość.
      const BASS = [[0, 6], [6, 6], [12, 2], [14, 2], [16, 2], [20, 8]];
      const padTones = [4, 6, 7, 9, 7, 6];
      const prog = [0, 3, 5, 4];
      let chordDeg = prog[0];
      const fire = (node, note, t, v) => { if (node.loaded) node.triggerAttack(note, t, v); };
      return {
        mix: { Stopa: kick, Werbel: snare, "Werbel cichy": ghost, "Hi-hat": hat, "Otwarty hi-hat": ohat, Shaker: shaker, Bas: sub, "Chór": choir, "Tło melodyczne": pad2, Melodia: glass },
        nodes: [vf, choir, pad2, vib, glass, kick, snare, ghost, hat, ohat, shaker, sub], tun: [choir, pad2, glass, sub],
        step(t, s, bar) {
          vf.frequency.rampTo(map(E.bright(), 0, 1, 600, 1600), 2, t);
          // Impuls pulsara nie gra ciągle: krótki błysk co 4 takty.
          if (s === 0 && bar % 4 === 0) { A.starVol.volume.setValueAtTime(-30, t); A.starVol.volume.linearRampToValueAtTime(-80, t + 0.3); }
          // Akord co 8 taktów, około 11 s: pod szybkim rytmem chór ma płynąć wolno.
          if (s === 0 && bar % 8 === 0) {
            const part = (bar / 8) % 4;
            chordDeg = windChord(part) ?? prog[part];
            const notes = chordDegs(chordDeg, 4).map((x) => E.n(x, -1));
            choir.releaseAll(t); choir.triggerAttack(notes, t, 0.5); E.chord(notes, t);
          }
          // Co 32 takty dwa takty samego chóru i melodii.
          if (bar % 32 < 30) {
            if (s === 0) Tone.Draw.schedule(() => vis.beat(), t);
            const br = BREAK[bar % 2];
            if (br.kick.includes(s)) fire(kick, "C2", t, 1);
            if (br.snare.includes(s)) fire(snare, bar % 4 === 3 ? "D3" : "C3", t, 0.9);
            if (br.ghost.includes(s) || (E.busy() > 0.3 && s === 13)) fire(ghost, "C3", t, 0.5 + Math.random() * 0.3);
            if (s % 2 === 0 && s !== 14) fire(hat, s % 4 ? "D3" : "C3", t, s % 4 ? 0.8 : 0.55);
            if (s === 14) fire(ohat, "C3", t, 0.7);
            if (s % 2 === 1) fire(shaker, "C3", t, 0.4 + E.busy() * 0.4);
            // Wysokości basu pisze wiatr, pierwsza nuta to zawsze podstawa akordu. Co drugi raz ostatnia nuta jest dłuższa.
            const pos = (bar % 2) * 16 + s, nb = BASS.findIndex(([at]) => at === pos);
            if (nb >= 0) {
              const w = windDegrees(0, 4), last = nb === BASS.length - 1;
              const deg = chordDeg + (nb === 0 || !w ? [0, 0, 2, 4, 2, 0][nb] : [0, 2, 4, 6, 7][w[nb * 2]]); // tylko dźwięki akordu, żeby bas nie gryzł się z melodią
              sub.triggerAttackRelease(E.n(deg, -3), (BASS[nb][1] + (last && bar % 4 === 3 ? 3 : 0)) * Tone.Time("16n").toSeconds(), t, nb < 2 || last ? 0.9 : 0.75);
            }
          }
          if (s === 0 && bar % 2 === 0) pad2.triggerAttackRelease(E.n(chordDeg + padTones[(bar / 2) % padTones.length], 0), 2.5, t, 0.5);
          // Melodia ćwierćnutami, fraza na 4 takty: jeden pomiar wiatru na ćwierćnutę.
          if (s % 4 === 0) {
            const i = (bar % 4) * 4 + (s >> 2), mel = windMelody(), d = mel ? (mel[i] != null ? 5 + mel[i] : null) : motif.at(i);
            if (d != null) {
              const n = E.n(d, 0);
              glass.triggerAttackRelease(n, "2n", t, 0.5 + Math.min(windChange(i) / 12, 1) * 0.3);
              E.note(n, t);
            }
          }
          if (s === 0 && bar % 4 === 3) motif.mutate(0.5);
        },
      };
    },
  },

  // Terzan 5: 716 obrotów na sekundę, wysoki pisk. Pozytywka w metrum na trzy.
  musicbox: {
    label: "Music box", barSteps: 12, scales: ["major", "aeolian"],
    make(B) {
      const box = vol(new Tone.PolySynth(Tone.FMSynth, { harmonicity: 8, modulationIndex: 2.5, envelope: { attack: 0.001, decay: 1.4, sustain: 0, release: 1.2 }, modulationEnvelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.3 } }), -9).connect(B.rev);
      const lowF = new Tone.Filter(1200, "lowpass").connect(B.rev);
      const low = vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.6, sustain: 0, release: 0.5 } }), -15).connect(lowF);
      const motif = new Motif(12, [7, 16], 0.55);
      const prog = [0, 4, 5, 3];
      return {
        mix: { Pozytywka: box, "Niskie nuty": low },
        nodes: [box, lowF, low], tun: [box, low],
        step(t, s, bar) {
          const deg = prog[Math.floor(bar / 2) % 4];
          if (s === 0) { low.triggerAttackRelease(E.n(deg, 0), "4n", t, 0.7); Tone.Draw.schedule(() => vis.beat(), t); if (bar % 2 === 0) E.chord(chordDegs(deg, 3).map((x) => E.n(x, 0)), t); }
          if (s === 4 || s === 8) low.triggerAttackRelease([E.n(deg + 2, 0), E.n(deg + 4, 0)], "8n", t, 0.45);
          const mel = windMelody(), mi = ((bar * 12 + s) >> 1) % 16; // fraza 16 ósemek przechodzi przez takty na 3/4
          if (mel ? s % 2 === 0 : s % 2 === 0 || E.busy() > 0.5) {
            const d = mel ? (mel[mi] != null ? 7 + mel[mi] : null) : motif.at(s);
            if (d != null) {
              const n = E.n(d, 0);
              // Pozytywka lekko rozstrojona i nierówna, jak mechanizm.
              box.triggerAttackRelease(n, "8n", t + Math.random() * 0.012, 0.5 + Math.random() * 0.3); E.note(n, t);
            }
          }
          if (s === 0 && bar % 4 === 3) motif.mutate(0.6);
        },
      };
    },
  },
};

async function initAudio() {
  await Tone.start();
  // Stop wycisza wyjście, bo część warstw (drony, bas z Bz) gra niezależnie od transportu.
  const master = new Tone.Volume(0).toDestination();
  const lim = new Tone.Limiter(-2).connect(master);
  const wave = new Tone.Waveform(512);
  master.connect(wave);
  const fft = new Tone.FFT(256);
  master.connect(fft);
  const rev = new Tone.Reverb({ decay: 9, preDelay: 0.05, wet: 0.5 });
  await rev.generate();
  rev.connect(lim);
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.38, wet: 0.35 }).connect(rev);

  // Warstwy wspólne dla wszystkich gatunków: bas przy Bz na południe, poświata przy wysokim Kp, sam pulsar.
  const droneVol = new Tone.Volume(-70).connect(lim);
  const droneFilter = new Tone.Filter(160, "lowpass").connect(droneVol);
  const drone = new Tone.FatOscillator("D1", "sawtooth", 14).connect(droneFilter).start();
  new Tone.LFO(0.08, 120, 400).connect(droneFilter.frequency).start();
  const starVol = new Tone.Volume(-80).connect(rev);
  const starFilter = new Tone.Filter(1400, "lowpass").connect(starVol);
  const star = new Tone.PulseOscillator(100, 0.85).connect(starFilter).start();
  const shimmerChorus = new Tone.Chorus(0.4, 3.5, 0.8).connect(rev).start();
  const shimmer = vol(new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 3, decay: 1, sustain: 0.8, release: 6 } }), -60).connect(shimmerChorus);
  // Rozbłysk jak w zwiastunie filmu: niskie uderzenie, które opada, i ciężki akord („braam”) z otwierającym się filtrem.
  const boom = vol(new Tone.MembraneSynth({ pitchDecay: 1.1, octaves: 2.5, oscillator: { type: "sine" }, envelope: { attack: 0.004, decay: 5, sustain: 0, release: 2 } }), -10);
  boom.connect(lim); boom.connect(rev);
  // Prawdziwy bęben wielki: uderzenie, a gdy wybrzmi, pocieranie membrany.
  const drumHit = vol(sampler({ C2: "wybuch-uderzenie" }, 2), -6);
  const drumRub = vol(sampler({ C2: "wybuch-pocieranie" }, 2), -14);
  for (const d of [drumHit, drumRub]) { d.connect(lim); d.connect(rev); }
  const braamF = new Tone.Filter({ frequency: 100, type: "lowpass", rolloff: -24, Q: 1.5 });
  const braamDist = new Tone.Distortion(0.45);
  const braamVol = new Tone.Volume(-16);
  braamF.chain(braamDist, braamVol, lim); braamVol.connect(rev);
  const braam = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 5, spread: 28 }, envelope: { attack: 0.06, decay: 2.5, sustain: 0.55, release: 4 } }).connect(braamF);
  const swellEnv = new Tone.AmplitudeEnvelope({ attack: 2, decay: 1, sustain: 0.3, release: 5 }).connect(rev);
  const swellFilter = new Tone.AutoFilter(0.15, 300, 4).connect(swellEnv).start();
  vol(new Tone.Noise("pink"), -14).connect(swellFilter).start();

  A = { master, lim, wave, fft, rev, delay, droneVol, drone, starVol, star, shimmer, boom, drumHit, drumRub, braam, braamF, swellEnv };
  Tone.Transport.scheduleRepeat(onStep, "16n");
  applyPulsarAudio();
}

function onStep(time) {
  if (!G) return;
  // Zegar pulsara rusza od pierwszego kroku gatunku. Transport.ticks jest za nim o lookAhead, więc nie nadaje się do wyrównania.
  if (pulsePending) {
    pulsePending = false;
    const start = Tone.Transport.getTicksAtTime(time) + Tone.Time(psr.P).toTicks();
    pulseId = Tone.Transport.scheduleRepeat(onPulse, psr.P, `${Math.round(start)}i`);
  }
  const bs = G.barSteps || 16;
  const s = stepCount % bs, bar = Math.floor(stepCount / bs);
  if (s === 0) {
    const next = cur.bz < -2 ? "dark" : cur.bz > 0 ? "bright" : mood;
    mood = next;
  }
  G.inst.step(time, s, bar);
  holdMutes();
  stepCount++;
}

function onPulse(time) {
  if (G && G.inst.pulse) G.inst.pulse(time);
  Tone.Draw.schedule(() => vis.pulse(), time);
}

// Impulsy startują na następnej szesnastce, razem z pierwszym krokiem nowego gatunku.
function schedulePulse() {
  if (pulseId != null) { Tone.Transport.clear(pulseId); pulseId = null; }
  pulsePending = false;
  if (M.kind !== "tempo") return;
  if (playing) { pulsePending = true; return; }
  pulseId = Tone.Transport.scheduleRepeat(onPulse, psr.P, "0i");
}

// Włączniki warstw pod ?dev, do rozmowy o konkretnych dźwiękach. Wyciszony zostaje wyciszony także po zmianie gatunku.
const mutedLayers = new Set(), savedLayerVolume = new Map();
const devMode = new URLSearchParams(location.search).has("dev");
function sharedLayers() {
  return { "Dron z Bz": A.drone, "Poświata z Kp": A.shimmer, "Impuls pulsara": A.star, "Wybuch: bęben": A.drumHit, "Wybuch: pocieranie": A.drumRub, "Wybuch: buum": A.boom, "Wybuch: braam": A.braam };
}
function layerEntries() {
  if (!A || !G) return [];
  const own = Object.entries(G.inst.mix).map(([name, node]) => [`${psr.genre}:${name}`, name, node]);
  return [...own, ...Object.entries(sharedLayers()).map(([name, node]) => [`wspólne:${name}`, name, node])];
}
function holdMutes() {
  if (!mutedLayers.size) return;
  for (const [key, , node] of layerEntries()) if (mutedLayers.has(key)) node.output.volume.value = -Infinity;
}
function toggleLayer(key, node) {
  if (mutedLayers.delete(key)) node.output.volume.value = savedLayerVolume.get(key) ?? 0;
  else { mutedLayers.add(key); savedLayerVolume.set(key, node.output.volume.value); holdMutes(); }
  renderLayers();
}
function renderLayers() {
  if (!devMode) return;
  const box = $("layers"), rows = layerEntries();
  box.innerHTML = "";
  for (const [key, name, node] of rows) {
    const b = document.createElement("button");
    b.className = "ghost"; b.textContent = name; b.dataset.layer = key;
    b.style.opacity = mutedLayers.has(key) ? 0.35 : 1;
    if (mutedLayers.has(key)) b.style.textDecoration = "line-through";
    b.onclick = () => toggleLayer(key, node);
    box.appendChild(b);
  }
}

function applyPulsarAudio() {
  M = musicFor(psr);
  vis.fast = M.kind === "tone";
  if (!A) return;
  const def = GENRES[psr.genre];
  // Stary gatunek płynnie cichnie na własnych szynach, nowy startuje od początku taktu.
  if (G) {
    const { inst: old, bus: oldBus } = G;
    old.nodes.forEach((n) => n.releaseAll && n.releaseAll());
    Object.values(oldBus).forEach((g) => g.gain.rampTo(0, 3));
    setTimeout(() => [...old.nodes, ...Object.values(oldBus)].forEach((n) => { try { n.dispose(); } catch (e) {} }), 4000);
  }
  E.root = 62 + M.tr;
  // Tempo przed make(): opóźnienia w nutach („8n.”) przeliczają się przy tworzeniu.
  Tone.Transport.bpm.value = bpmFor(psr);
  A.delay.delayTime.rampTo(Tone.Time("8n.").toSeconds(), 0.2);
  const bus = { lim: new Tone.Gain().connect(A.lim), rev: new Tone.Gain().connect(A.rev), delay: new Tone.Gain().connect(A.delay) };
  G = { ...def, bus, inst: def.make(bus) };
  for (const [key, , node] of layerEntries()) if (mutedLayers.has(key)) savedLayerVolume.set(key, node.output.volume.value);
  holdMutes(); renderLayers();
  G.inst.tun.forEach((n) => { if (n.set) n.set({ detune: M.cents }); else if (n.detune) n.detune.value = M.cents; });
  schedulePulse();
  if (M.kind === "tempo") {
    A.starVol.volume.rampTo(-80, 0.5);
  } else {
    A.star.frequency.value = M.f;
    if (playing) if (!G?.pulseBurst) A.starVol.volume.rampTo(M.f < 20 ? -28 : M.f < 100 ? -33 : M.f < 400 ? -32 : -40, 1.5);
  }
  A.shimmer.set({ detune: M.cents }); A.braam.set({ detune: M.cents }); A.boom.detune.value = M.cents;
  A.drone.frequency.value = Tone.Frequency(E.m(0, -3), "midi").toFrequency();
  A.drone.detune.value = M.cents;
  stepCount = 0;
}

function updateAudioParams() {
  if (!A) return;
  A.droneVol.volume.rampTo(cur.bz < 0 ? map(-cur.bz, 0, 20, -30, -12) : -70, 2);
  A.shimmer.volume.rampTo(cur.kp >= 4 ? map(cur.kp, 4, 9, -32, -16) : -60, 2);
  A.delay.feedback.rampTo(map(cur.wind, 300, 800, 0.3, 0.55), 2);
}

function triggerFlare(level) {
  vis.flare(level);
  if (!playing || !A) return;
  const now = Tone.now();
  A.boom.triggerAttackRelease(E.n(0, -3), "1n", now, level === 2 ? 0.6 : 1);
  const hit = level === 2 ? 0.6 : level === 3 ? 0.8 : 1;
  if (A.drumHit.loaded) A.drumHit.triggerAttack("C2", now, hit);
  if (A.drumRub.loaded) A.drumRub.triggerAttack("C2", now + 2, hit);
  if (level >= 3) {
    // Kwinta z oktawą, przy klasie X także tercja: mroczna albo jasna, zależnie od Bz.
    const ch = [E.n(0, -3), E.n(4, -3), E.n(0, -2)];
    if (level === 4) ch.push(E.n(2, -2), E.n(4, -2));
    A.braam.triggerAttackRelease(ch, level === 4 ? 3.5 : 1.8, now + 0.02, 0.9);
    const f = A.braamF.frequency;
    f.cancelScheduledValues(now);
    f.setValueAtTime(80, now);
    f.exponentialRampToValueAtTime(level === 4 ? 1600 : 700, now + 1.1);
    f.exponentialRampToValueAtTime(90, now + (level === 4 ? 6 : 4));
  }
  if (level >= 3) A.swellEnv.triggerAttackRelease(level === 4 ? 4 : 2, now);
}

// Po Stop wstrzymujemy cały kontekst dźwięku: samo wyciszenie zostawiało pogłos i oscylatory liczące w tle (około połowy rdzenia).
let suspendTimer = null;
function stopAudio() {
  clearTimeout(suspendTimer);
  suspendTimer = setTimeout(() => { if (!playing) Tone.getContext().rawContext.suspend(); }, 600);
  Tone.Transport.stop();
  if (G) G.inst.nodes.forEach((n) => n.releaseAll && n.releaseAll());
  A.shimmer.releaseAll();
  A.starVol.volume.rampTo(-80, 0.3);
  A.master.volume.rampTo(-80, 0.3);
}

// ---------- Obraz: wspólne ----------
const canvas = $("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
const stars = [];
let particles = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars.length = 0;
  for (let i = 0; i < Math.round((W * H) / 3500); i++)
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + 0.2, a: Math.random() * 0.6 + 0.2, f: 0, ph: Math.random() * 6.28 });
  particles = [];
  vis.clear = true;
  if (sheetOpen) sizeSky();
}

// Układ: poziomo Słońce z lewej, Ziemia z prawej; pionowo Słońce u góry, Ziemia niżej.
function layout() {
  const m = Math.min(W, H);
  if (H > W) return { sun: { x: W * 0.5, y: H * 0.27 }, earth: { x: W * 0.5, y: H * 0.52 }, sunR: m * 0.075, earthR: m * 0.035, pulsar: { x: W * 0.84, y: H * 0.2 } };
  return { sun: { x: W * 0.24, y: H * 0.42 }, earth: { x: W * 0.72, y: H * 0.42 }, sunR: m * 0.07, earthR: m * 0.032, pulsar: { x: W * 0.9, y: H * 0.16 } };
}

const vis = {
  style: "ridges", pulses: 0, chordPc: null, beatT: 0, pulseT: 0, flareT: 0, flareLevel: 0, hue: 220, hueTarget: 220, fast: false, clear: true,
  beat() { this.beatT = 1; },
  pulse() { this.pulses++; this.pulseT = 1; },
  note(n) {
    const s = stars[Math.floor(Math.random() * stars.length)]; if (s) s.f = 1;
  },
  chord(m, chord) { this.chordPc = ((Tone.Frequency(chord[0]).toMidi() % 12) + 12) % 12; this.hueTarget = m === "dark" ? 300 : 220; },
  flare(level) { this.flareT = 1; this.flareLevel = level; RIDGE.flare = Math.max(RIDGE.flare, level); WAVES.flare = Math.max(WAVES.flare, level); CY.kick = 0.03; },
};

// Dane wygładzane poza requestAnimationFrame: w ukrytej karcie klatek nie ma, a muzyka gra dalej.
let lastDataT = performance.now();
function stepData() {
  const now = performance.now(), k = 1 - Math.exp(-((now - lastDataT) / 1000) * 1.2);
  lastDataT = now;
  for (const key of ["wind", "dens", "bz", "kp"]) cur[key] = lerp(cur[key], target[key], k);
}

const pressure = () => 1.6726e-6 * cur.dens * cur.wind * cur.wind;
const standoff = () => clamp(10 * Math.pow(pressure() / 2, -1 / 6), 5, 14);
const auroraLevel = () => clamp((cur.kp - 2) / 6 + Math.max(0, -cur.bz) / 25, 0, 1);
const southward = () => clamp(-cur.bz / 15, 0, 1);
// Kształt magnetopauzy z modelu Shue: r = r0 * (2 / (1 + cos θ))^0.5, θ od kierunku na Słońce.
const shueR = (r0, th) => r0 * Math.sqrt(2 / Math.max(0.08, 1 + Math.cos(th)));
const r0px = (L) => L.earthR * standoff() * 0.6;

function shuePath(r0, span = 2.3) {
  ctx.beginPath();
  for (let th = -span; th <= span + 1e-6; th += 0.04) {
    const r = shueR(r0, th);
    th === -span ? ctx.moveTo(r * Math.cos(th), r * Math.sin(th)) : ctx.lineTo(r * Math.cos(th), r * Math.sin(th));
  }
}

// Cząstki wiatru: wspólne dla stylów, które je rysują.
function stepParticles(L, dt) {
  const s = L.sun, e = L.earth;
  const dx = e.x - s.x, dy = e.y - s.y, dist = Math.hypot(dx, dy);
  const ux = dx / dist, uy = dy / dist, px = -uy, py = ux;
  const speed = (dist / 3) * (cur.wind / 400);
  let n = (12 + cur.dens * 10) * dt;
  while (n > 0) {
    if (Math.random() < n) {
      const off = (Math.random() - 0.5) * Math.max(L.sunR * 3, r0px(L) * 3);
      particles.push({ x: s.x + ux * L.sunR + px * off, y: s.y + uy * L.sunR + py * off, vx: ux, vy: uy, life: 1, sp: speed * (0.8 + Math.random() * 0.4) });
    }
    n -= 1;
  }
  const r0 = r0px(L);
  for (const p of particles) {
    p.x += p.vx * p.sp * dt; p.y += p.vy * p.sp * dt;
    const ex = p.x - e.x, ey = p.y - e.y, d = Math.hypot(ex, ey);
    if (d < r0 * 1.15) {
      p.vx = lerp(p.vx, ex / d, 0.12); p.vy = lerp(p.vy, ey / d, 0.12);
      const nrm = Math.hypot(p.vx, p.vy); p.vx /= nrm; p.vy /= nrm;
      p.life -= dt * 1.2;
    }
    if (p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) p.life = 0;
  }
  particles = particles.filter((p) => p.life > 0);
  if (particles.length > 2500) particles.splice(0, particles.length - 2500);
}

// 30 klatek wystarcza do tych animacji, a zużywa o połowę mniej procesora. Bez grania 15: obraz tylko miga z pulsarem.
const frameMs = () => 1000 / (playing ? 30 : 15);
let lastT = performance.now();
function frame(t) {
  if (t - lastT < frameMs() - 2) { nextFrame(t); return; }
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  stepData();
  vis.hue = lerp(vis.hue, vis.hueTarget, 1 - Math.exp(-dt * 0.6));
  vis.beatT *= Math.exp(-dt * 7);
  vis.pulseT *= Math.exp(-dt * 6);
  vis.flareT *= Math.exp(-dt * (vis.flareLevel >= 4 ? 0.7 : 1.4));
  // Bez dźwięku pulsar i tak miga w swoim rytmie.
  if (!playing && !vis.fast) {
    const ph = (t / 1000) % psr.P;
    if (ph < vis._lastPh) vis.pulse();
    vis._lastPh = ph;
  }
  // Mapa zakrywa scenę, więc nie ma po co jej rysować.
  if (sheetOpen) drawSky(t / 1000);
  else {
    const L = layout();
    if (vis.style === "bauhaus") stepParticles(L, dt);
    STYLES[vis.style](L, dt, t / 1000);
  }
  nextFrame(t);
}
// Czekamy do następnej klatki zwykłym zegarem, zamiast budzić przeglądarkę 60 razy na sekundę.
function nextFrame(t) {
  const wait = lastT + frameMs() - t - 8;
  if (wait > 0) setTimeout(() => requestAnimationFrame(frame), wait);
  else requestAnimationFrame(frame);
}

// ---------- Styl: Bauhaus ----------
// Płaskie koła i łuki w kilku kolorach. Słońce, Ziemia i magnetosfera rozpoznawalne po relacjach, nie po teksturze.
const BH = { cream: "#efe6d2", red: "#e4573d", ochre: "#e9b949", blue: "#3466c9", green: "#5fd38d", magenta: "#d5487f" };
function drawBauhaus(L, dt, time) {
  const so = southward();
  ctx.fillStyle = `hsl(${lerp(230, 320, so)}, ${lerp(12, 22, so)}%, ${lerp(7, 7.5, so)}%)`;
  ctx.fillRect(0, 0, W, H);

  // Zorza: pionowe pasy u góry, wysokość z aktywności.
  const al = auroraLevel();
  if (al > 0.04) {
    const n = 22, w = W / n;
    for (let i = 0; i < n; i++) {
      const h = H * 0.16 * al * (0.55 + 0.45 * Math.sin(time * 0.6 + i * 0.7));
      ctx.fillStyle = i % 5 === 0 && cur.kp > 6 ? BH.magenta : BH.green;
      ctx.globalAlpha = 0.1 + 0.16 * al;
      ctx.fillRect(i * w + w * 0.2, 0, w * 0.6, h);
    }
    ctx.globalAlpha = 1;
  }

  // Wiatr: krótkie równoległe kreski, długość z prędkości.
  ctx.lineCap = "round";
  ctx.lineWidth = 1.6;
  const len = map(cur.wind, 300, 800, 6, 22);
  ctx.strokeStyle = so > 0.3 ? BH.magenta : BH.cream;
  ctx.globalAlpha = 0.65;
  ctx.beginPath();
  for (const p of particles) { ctx.moveTo(p.x - p.vx * len, p.y - p.vy * len); ctx.lineTo(p.x, p.y); }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Słońce: pełne koło z mniejszym, przesuniętym kołem w środku.
  const { x: sx, y: sy } = L.sun, R = L.sunR;
  if (vis.flareT > 0.02) {
    for (let i = 3; i >= 1; i--) {
      ctx.fillStyle = i % 2 ? BH.cream : BH.ochre;
      ctx.globalAlpha = vis.flareT * 0.9;
      ctx.beginPath(); ctx.arc(sx, sy, R * (1 + i * 0.45 * (1.4 - vis.flareT)), 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = BH.red;
  ctx.beginPath(); ctx.arc(sx, sy, R * (1 + vis.pulseT * 0.04), 0, 6.283); ctx.fill();
  const ia = time * 0.25;
  ctx.fillStyle = BH.ochre;
  ctx.beginPath(); ctx.arc(sx + Math.cos(ia) * R * 0.32, sy + Math.sin(ia) * R * 0.32, R * map(cur.wind, 300, 800, 0.32, 0.55), 0, 6.283); ctx.fill();

  // Ziemia i magnetosfera w układzie, w którym oś x patrzy na Słońce.
  const { x: ex, y: ey } = L.earth, r = L.earthR;
  ctx.save(); ctx.translate(ex, ey); ctx.rotate(Math.atan2(sy - ey, sx - ex));
  const r0 = r0px(L);
  ctx.strokeStyle = BH.ochre; ctx.lineWidth = 5 + vis.beatT * 3; ctx.lineCap = "butt";
  shuePath(r0, 1.9); ctx.stroke();
  ctx.fillStyle = BH.blue; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  if (al > 0.03) {
    ctx.fillStyle = BH.green;
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.arc(-r * 0.1, side * r * 1.15, r * (0.18 + 0.32 * al), 0, 6.283); ctx.fill(); }
  }
  ctx.restore();

  // Pulsar: obracający się kwadrat z dwiema wiązkami.
  drawPulsarGeo(L, time, BH.cream);
}

function drawPulsarGeo(L, time, color) {
  const { x, y } = L.pulsar;
  const a = vis.fast ? time * 40 : (time / psr.P) * 6.283 * 0.08;
  ctx.save(); ctx.translate(x, y);
  ctx.globalAlpha = 0.35 + vis.pulseT * 0.65;
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.save(); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(34, 0); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.fillStyle = color;
  const s = 6 + vis.pulseT * 4 + (vis.fast ? Math.sin(time * 60) * 1.5 : 0);
  ctx.save(); ctx.rotate(a * 0.5); ctx.fillRect(-s / 2, -s / 2, s, s); ctx.restore();
  ctx.globalAlpha = 0.55; ctx.font = "600 10.5px -apple-system, sans-serif"; ctx.textAlign = "center";
  ctx.fillText(psr.short.split(" · ")[0], 0, 26);
  ctx.restore(); ctx.globalAlpha = 1;
}

// ---------- Styl: Oscyloskop ----------
// Jedna świecąca linia na czarnym ekranie, z poświatą luminoforu. Słońce drga w kształcie prawdziwej fali dźwięku.
function drawScope(L, dt, time) {
  if (vis.clear) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); vis.clear = false; }
  ctx.fillStyle = "rgba(0,5,3,0.24)";
  ctx.fillRect(0, 0, W, H);
  const so = southward();
  const col = `rgb(${Math.round(lerp(124, 255, so))},${Math.round(lerp(255, 176, so))},${Math.round(lerp(178, 90, so))})`;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.shadowColor = col; ctx.shadowBlur = 8;
  ctx.lineWidth = 1.4;

  // Siatka ekranu.
  ctx.save(); ctx.shadowBlur = 0; ctx.globalAlpha = 0.07; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();

  const { x: sx, y: sy } = L.sun, R = L.sunR;
  const wave = A && playing ? A.wave.getValue() : null;
  ctx.beginPath();
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * 6.283;
    const w = wave ? wave[Math.floor((i / 128) * (wave.length - 1))] : Math.sin(a * 6 + time * 2) * 0.03;
    const rr = R * (1 + w * 0.9 + vis.flareT * 0.5 * Math.sin(a * 13 + time * 20));
    i === 0 ? ctx.moveTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr) : ctx.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr);
  }
  ctx.stroke();

  // Wiatr: sinusoidy płynące od Słońca, opływające magnetosferę.
  const { x: ex, y: ey } = L.earth, r = L.earthR, r0 = r0px(L);
  const D = Math.hypot(sx - ex, sy - ey);
  ctx.save(); ctx.translate(ex, ey); ctx.rotate(Math.atan2(sy - ey, sx - ex));
  const lines = Math.round(map(cur.dens, 1, 20, 4, 13));
  const spread = Math.max(r0 * 1.8, R * 1.6);
  const k = 0.045, w = (cur.wind / 400) * 4, amp = map(cur.dens, 1, 20, 2, 7);
  ctx.globalAlpha = 0.75;
  for (let l = 0; l < lines; l++) {
    const y0 = lines === 1 ? 0 : -spread + (2 * spread * l) / (lines - 1);
    ctx.beginPath();
    let first = true;
    for (let x = D - R * 1.3; x > -D * 0.9; x -= 5) {
      let y = y0 + amp * Math.sin(k * x + time * w + l);
      let px = x, py = y;
      const th = Math.atan2(py, px), d = Math.hypot(px, py), lim = shueR(r0, th) * 1.06;
      if (d < lim && Math.cos(th) > -0.95) { px = Math.cos(th) * lim; py = Math.sin(th) * lim; }
      if (Math.abs(py) > H) continue;
      first ? ctx.moveTo(px, py) : ctx.lineTo(px, py); first = false;
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.setLineDash([4, 5]); shuePath(r0, 2.2); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, 6.283); ctx.fill();
  const al = auroraLevel();
  for (let i = 0; i < Math.round(al * 4); i++)
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(-r * 0.1, side * r * 0.95, r * (0.45 + i * 0.2), r * (0.15 + i * 0.07), 0, 0, 6.283); ctx.stroke(); }
  ctx.restore();

  // Pulsar: przebieg impulsów przewijany po ekranie, jak w radioteleskopie.
  const { x: px, y: py } = L.pulsar, pw = Math.min(160, W * 0.32);
  ctx.save(); ctx.translate(px - pw, py);
  ctx.beginPath();
  for (let i = 0; i <= pw; i += 1) {
    const tt = time - ((pw - i) / pw) * 4; // 4 s historii
    let v;
    if (!vis.fast) { const ph = ((tt % psr.P) + psr.P) % psr.P / psr.P; v = Math.exp(-Math.pow((ph - 0.02) / 0.012, 2)) + 0.5 * Math.exp(-Math.pow((ph - 0.035) / 0.01, 2)); }
    else v = 0.5 + 0.5 * Math.sin(i * 0.9 + time * 30);
    v += (Math.random() - 0.5) * 0.06;
    i === 0 ? ctx.moveTo(i, -v * 18) : ctx.lineTo(i, -v * 18);
  }
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 0.6; ctx.font = "10.5px ui-monospace, Menlo, monospace"; ctx.textAlign = "right";
  ctx.fillText(psr.short.split(" · ")[0], pw, 16);
  ctx.restore();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

// ---------- Wspólne dla nowych kierunków (docs/WIZUALIZACJE.md) ----------
// Miejsce na obraz: między przełącznikiem stylów a panelem.
function stage() {
  const top = document.querySelector(".top").offsetHeight + 10;
  // Na telefonie dane leżą nad paskiem, na komputerze po lewej, więc dół obrazu wyznacza wyższy z nich.
  const low = document.querySelector(window.innerWidth <= 640 ? ".stats" : ".bar").getBoundingClientRect().top;
  const bottom = $("panel").classList.contains("hidden") ? H - 14 : low - 14;
  const h = Math.max(80, bottom - top);
  return { y: top, w: W, h, cx: W / 2, cy: top + h / 2 };
}
const BONE = [239, 230, 210], ROSE = [255, 88, 130], INK = "#0a0b12";
const mix = (a, b, t, alpha = 1) => `rgba(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",")},${alpha})`;
function offscreen(old, w, h) {
  const c = old || document.createElement("canvas");
  c.width = w * DPR; c.height = h * DPR;
  const g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return { c, g };
}
// Prawda raz na obrót wolnego pulsara albo raz na uderzenie szybkiego, nie częściej niż 5 razy na sekundę.
function rotationDue(st, time) {
  if (!vis.fast) {
    if (vis.pulses === st.pulses) return false;
    st.pulses = vis.pulses;
    if (time - st.last < 0.2) return false;
  } else if (time - st.last < 60 / bpmFor(psr)) return false;
  st.last = time;
  return true;
}

// ---------- Kierunek 1: Grzbiety impulsów ----------
// Jedna linia na obrót: kształt dźwięku w tej chwili. Stos przesuwa się w górę, przednia linia zasłania tylne.
const RIDGE_POINTS = 96;
const RIDGE = { lines: [], live: new Float32Array(RIDGE_POINTS), last: -9, pulses: 0, flare: 0, c: null, key: "", dirty: true };
function ridgeProfile(time, seed) {
  const out = new Float32Array(RIDGE_POINTS), fft = A && playing ? A.fft.getValue() : null;
  const shake = 0.012 + E.bright() * 0.09;
  for (let i = 0; i < RIDGE_POINTS; i++) {
    const x = (i + 0.5) / RIDGE_POINTS * 2 - 1, u = Math.abs(x);
    // Niskie tony w środku, wysokie na brzegach; idealną symetrię łamie wolna fala.
    const v = fft ? Math.pow(map(fft[Math.min(fft.length - 1, Math.round(Math.pow(fft.length, u)) - 1)], -96, -22, 0, 1), 1.7)
      : 0.16 + 0.1 * Math.sin(x * 11 + seed) + 0.06 * Math.sin(x * 23 + seed * 1.7);
    const envelope = Math.exp(-Math.pow(x / 0.56, 4));
    out[i] = Math.max(0, v * (1 + 0.28 * Math.sin(x * 8 + seed)) + (Math.random() - 0.5) * shake) * envelope;
  }
  // Wygładzenie: sąsiednie punkty często czytają ten sam przedział widma.
  for (let pass = 0; pass < 2; pass++) {
    let prev = out[0];
    for (let i = 1; i < RIDGE_POINTS - 1; i++) { const here = out[i]; out[i] = prev * 0.25 + here * 0.5 + out[i + 1] * 0.25; prev = here; }
  }
  return out;
}
function ridgeLine(time, seed) {
  const v = ridgeProfile(time, seed), so = southward();
  if (RIDGE.flare) {
    // Rozbłysk: jedna linia dostaje górę wyższą niż reszta stosu.
    const x0 = (Math.random() - 0.5) * 0.5, top = 0.5 + RIDGE.flare * 0.3;
    for (let i = 0; i < RIDGE_POINTS; i++) v[i] += top * Math.exp(-Math.pow(((i + 0.5) / RIDGE_POINTS * 2 - 1 - x0) / 0.07, 2));
    RIDGE.flare = 0;
  }
  return { v, color: so, blur: E.bright() };
}
function ridgePath(c, v, x0, w, y, amp) {
  c.beginPath(); c.moveTo(x0, y);
  for (let i = 0; i < RIDGE_POINTS; i++) c.lineTo(x0 + (i + 0.5) / RIDGE_POINTS * w, y - v[i] * amp);
  c.lineTo(x0 + w, y);
}
function strokeRidge(c, line, x0, w, y, amp, alpha) {
  ridgePath(c, line.v, x0, w, y, amp);
  c.fillStyle = INK; c.fill();
  if (line.blur > 0.2) { c.strokeStyle = mix(BONE, ROSE, line.color, alpha * 0.16 * line.blur); c.lineWidth = 4; c.stroke(); }
  c.strokeStyle = mix(BONE, ROSE, line.color, alpha); c.lineWidth = 1.3; c.stroke();
}
function drawRidges(L, dt, time) {
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  const S = stage(), N = clamp(Math.round(S.h / 10), 22, 54), w = Math.min(S.w * 0.86, Math.max(S.h * 1.25, 320));
  const amp = Math.min(S.h * 0.17, 90), gap = (S.h - amp - 4) / N, x0 = S.cx - w / 2, front = S.y + S.h - 4;
  while (RIDGE.lines.length < N) { RIDGE.lines.unshift({ v: ridgeProfile(time, RIDGE.lines.length * 2.3), color: southward(), blur: 0 }); RIDGE.dirty = true; }
  if (RIDGE.flare || rotationDue(RIDGE, time)) {
    RIDGE.lines.push(ridgeLine(time, time));
    RIDGE.dirty = true;
  }
  while (RIDGE.lines.length > N) RIDGE.lines.shift();
  const key = `${W}x${H}:${S.y}:${S.h}`;
  if (RIDGE.dirty || key !== RIDGE.key) {
    const { c, g } = offscreen(RIDGE.c, W, H);
    RIDGE.c = c; RIDGE.key = key; RIDGE.dirty = false;
    g.lineJoin = "round";
    g.save(); g.beginPath(); g.rect(0, S.y, W, H - S.y); g.clip();
    RIDGE.lines.forEach((line, i) => strokeRidge(g, line, x0, w, front - (N - i) * gap, amp, 0.16 + 0.84 * Math.pow((i + 1) / N, 1.4)));
    g.restore();
  }
  ctx.drawImage(RIDGE.c, 0, 0, W, H);
  // Linia na żywo, jeszcze niezapisana.
  const next = ridgeProfile(time, time * 0.3);
  for (let i = 0; i < RIDGE_POINTS; i++) RIDGE.live[i] = lerp(RIDGE.live[i], next[i], 0.45);
  ctx.lineJoin = "round";
  strokeRidge(ctx, { v: RIDGE.live, color: southward(), blur: E.bright() }, x0, w, front, amp, 0.75 + vis.pulseT * 0.25);
}

// ---------- Kierunek 2: Fale ----------
// Słońce w środku, fale rozchodzą się we wszystkie strony. Każdy takt rodzi jedną i dostaje dane z tej chwili;
// prędkość fali to prędkość wiatru, więc szybki strumień dogania wolniejszy. Rozbłysk biegnie szybciej od reszty.
const WAVE_CROSSING = 75; // sekundy na dojście do brzegu przy 450 km/s
const WAVES = { list: [], seeded: false, flare: 0, nextAt: 0 };
const waveSpeed = (wind) => wind / 450 / WAVE_CROSSING; // części drogi do brzegu na sekundę
function seedWaves(history) {
  if (WAVES.seeded) return;
  WAVES.seeded = true;
  // Na start ostatnie godziny pomiarów już w drodze: najstarsze przy brzegu, najnowsze przy Słońcu.
  const now = performance.now() / 1000;
  WAVES.list.unshift(...history.map((h, i) => {
    const speed = waveSpeed(h.wind);
    return { ...h, speed, born: now - (1 - i / history.length) / speed };
  }));
}
function snapHistory() {
  const out = [];
  for (let i = 0; i < SNAP.wind.length; i += 3) out.push({ wind: SNAP.wind[i], dens: SNAP.dens[i], bz: SNAP.bz[Math.round(i / SNAP.wind.length * (SNAP.bz.length - 1))], kp: SNAP.kp, flare: 0 });
  return out;
}
// Poza klatkami animacji, żeby fale szły też w ukrytej karcie.
function emitWave() {
  const now = performance.now() / 1000;
  if (now < WAVES.nextAt) return;
  const def = GENRES[psr.genre];
  WAVES.nextAt = now + (def.barSteps || 16) / 4 * 60 / bpmFor(psr);
  const flare = WAVES.flare;
  WAVES.list.push({ wind: cur.wind, dens: cur.dens, bz: cur.bz, kp: cur.kp, flare, speed: waveSpeed(cur.wind) * (flare ? 3 : 1), born: now });
  WAVES.flare = 0;
}
function waveColor(w, alpha) {
  const so = clamp(-w.bz / 15, 0, 1), glow = map(w.kp, 3, 8, 0, 1), light = map(w.wind, 300, 800, 0.55, 1);
  return mix(BONE.map((v, i) => lerp(v, [95, 211, 141][i], glow * 0.7) * light), ROSE, so, alpha);
}
// Wspólny, wolno zmieniający się kształt: sąsiednie fale są podobne, jak fronty jednego strumienia.
const waveShape = (a, born) => 0.5 * Math.sin(3 * a + 1.1 + born * 0.03) + 0.3 * Math.sin(5 * a + 2.7 - born * 0.05) + 0.2 * Math.sin(9 * a + 0.4 + born * 0.08);
function drawWaves(L, dt, time) {
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  const S = stage(), now = performance.now() / 1000, sunR = Math.min(S.w, S.h) * 0.055;
  const reach = Math.hypot(Math.max(S.cx, W - S.cx), Math.max(S.cy, H - S.cy));
  WAVES.list = WAVES.list.filter((w) => (now - w.born) * w.speed < 1);
  ctx.lineJoin = "round";
  for (const w of WAVES.list) {
    const t = (now - w.born) * w.speed, r = sunR + t * (reach - sunR), wobble = 0.012 + 0.075 * map(w.wind, 300, 800, 0, 1);
    ctx.beginPath();
    for (let k = 0; k <= 72; k++) {
      const a = k / 72 * 6.2832, rr = r * (1 + wobble * t * waveShape(a, w.born));
      k ? ctx.lineTo(S.cx + Math.cos(a) * rr, S.cy + Math.sin(a) * rr) : ctx.moveTo(S.cx + Math.cos(a) * rr, S.cy + Math.sin(a) * rr);
    }
    ctx.closePath();
    const fade = Math.pow(1 - t, 0.7);
    if (w.flare) { ctx.strokeStyle = `rgba(255,242,196,${fade})`; ctx.lineWidth = 2 + w.flare * 1.4; }
    else { ctx.strokeStyle = waveColor(w, 0.9 * fade); ctx.lineWidth = map(w.dens, 1, 15, 0.8, 7); }
    ctx.stroke();
  }
  // Słońce: brzeg drga falą dźwięku, błyska z pulsarem i przy rozbłysku.
  const sound = A && playing ? A.wave.getValue() : null;
  ctx.beginPath();
  for (let k = 0; k <= 96; k++) {
    const a = k / 96 * 6.2832, v = sound ? sound[Math.floor(k / 96 * (sound.length - 1))] : 0;
    const rr = sunR * (1 + vis.pulseT * 0.06 + vis.flareT * 0.5) + v * sunR * 0.9;

const CY_MAX = 5200;

// Niebo z danych (data/sky.js, z d3-celestial). Domyślnie wariant A: Droga Mleczna jako płaty i gwiazdy.

function traceSky(g, pts, dx, close, pole = close) {

  const top = document.querySelector(".sheet-head").getBoundingClientRect().bottom + 12 - wrap.top;

// Tło mapy się nie zmienia: rysowane raz, przy zmianie rozmiaru.
function renderSkyBase(dpr) {

  // Kolory podpisów takie jak w wizualizacji: Bz na południe różowieje, Kp zielenieje jak zorza, rozbłysk to jasny błysk.
  $("rBz").style.color = mix(BONE, ROSE, southward());
  $("rKp").style.color = mix(BONE, [95, 211, 141], map(cur.kp, 3, 8, 0, 1) * 0.7);
  $("rX").style.color = mix([239, 230, 210], [255, 242, 196], vis.flareT);
  $("vX").textContent = mode === "storm" ? "X2.1" : mode === "live" && target.xray ? xrayClass(target.xray).letter : "–";
  $("psrDot").style.opacity = 0.35 + 0.65 * vis.pulseT;
  updateAudioParams();
}, 100);

$("play").onclick = async () => {
  try {
    if (!window.Tone) throw new Error("The sound library (Tone.js) didn't load.");
    if (!A) await initAudio();
    if (!playing) {
      clearTimeout(suspendTimer);
      if (Tone.getContext().rawContext.state !== "running") await Tone.getContext().rawContext.resume();
      stepCount = 0; schedulePulse(); A.master.volume.rampTo(0, 0.1); Tone.Transport.start("+0.1"); playing = true;
      if (M.kind === "tone") if (!G?.pulseBurst) A.starVol.volume.rampTo(M.f < 20 ? -28 : M.f < 100 ? -33 : M.f < 400 ? -32 : -40, 1.5);
    } else { stopAudio(); playing = false; }
    $("play").innerHTML = playing ? ICONS.stop : ICONS.play;
    $("play").title = $("play").ariaLabel = playing ? "Stop" : "Play";
    $("play").classList.toggle("on", playing);
  } catch (e) {
    $("status").innerHTML = `<span class="err">${e.message}</span>`; $("status").classList.add("show");
  }
};
// iOS przerywa dźwięk (telefon, blokada) i sam go nie wznawia. Wznowienie po powrocie lub po dotknięciu ekranu.
function resumeAudio() { if (playing && Tone.context.state !== "running") Tone.context.resume(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) resumeAudio(); });
addEventListener("pointerdown", resumeAudio);
// Ikony trybów: nadawanie na żywo, zapis (zegar wstecz), burza.
const MODE_ICONS = {
  live: '<circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>',
  replay: '<path d="M3.5 12a8.5 8.5 0 1 0 2.5-6L3.5 8.5"/><path d="M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/>',
  storm: '<path d="M13 2 5 13.5h6L10 22l9-12h-6z"/>',
};
const modeIcon = (m) => m === "live" || !MODE_ICONS[m] ? ICONS.live : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MODE_ICONS[m] || MODE_ICONS.live}</svg>`;
function showMode() {
  const b = document.querySelector(`#modes button[data-mode="${mode}"]`);
  $("modeBtn").innerHTML = modeIcon(b ? mode : "live");
  $("modeBtn").ariaLabel = "Data: " + (b ? b.textContent.trim() : "manual");
}
const toggleModePop = (open) => { $("modePop").classList.toggle("open", open); $("modeBtn").setAttribute("aria-expanded", open); };
document.querySelectorAll("#modes button").forEach((b) => {
  b.insertAdjacentHTML("afterbegin", modeIcon(b.dataset.mode));
  b.onclick = () => { enterMode(b.dataset.mode); showMode(); toggleModePop(false); };
});
$("modeBtn").onclick = (e) => { e.stopPropagation(); toggleModePop(!$("modePop").classList.contains("open")); };
document.addEventListener("click", (e) => { if (!$("modePop").contains(e.target)) toggleModePop(false); });
showMode();
// Ikony wizualizacji: mały obrazek tego, co rysuje dany styl.
const STYLE_ICONS = {
  ridges: '<path d="M2 8c3 0 4-4 7-4s4 4 7 4 4-2 6-2M2 13c3 0 4-4 7-4s4 4 7 4 4-2 6-2M2 18c3 0 4-4 7-4s4 4 7 4 4-2 6-2"/>',
  waves: '<circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/>',
  cymatics: '<circle cx="12" cy="12" r="10"/><path d="M12 2c4 5 4 15 0 20c-4-5-4-15 0-20M2 12c5-4 15-4 20 0c-5 4-15 4-20 0"/>',
  color: '<defs><linearGradient id="icoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa2ff"/><stop offset="1" stop-color="#ff7ab6"/></linearGradient></defs><circle cx="12" cy="12" r="10" fill="url(#icoGrad)" stroke="none"/>',
  bauhaus: '<circle cx="8" cy="9" r="5" fill="currentColor" stroke="none"/><path d="M13 21a8 8 0 0 1 8-8"/><rect x="14" y="3" width="6" height="6"/>',
  scope: '<path d="M2 12c2.5-7 5-7 7.5 0s5 7 7.5 0 3-5 5-3"/>',
};
const icon = (st) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${STYLE_ICONS[st]}</svg>`;
function showStyle() {
  const b = document.querySelector(`#styles button[data-style="${vis.style}"]`);
  $("styleBtn").innerHTML = ICONS.style;
  $("styleBtn").title = $("styleBtn").ariaLabel = "Visual style: " + b.textContent.trim();
  $("styleNote").textContent = STYLE_NOTES[vis.style] || "";
  document.querySelectorAll("#styles button").forEach((x) => x.classList.toggle("on", x === b));
}
const toggleStylePop = (open) => { $("stylePop").classList.toggle("open", open); $("styleBtn").setAttribute("aria-expanded", open); };
document.querySelectorAll("#styles button").forEach((b) => {
  b.insertAdjacentHTML("afterbegin", icon(b.dataset.style));
  b.onclick = () => { vis.style = b.dataset.style; vis.clear = true; showStyle(); toggleStylePop(false); if (sheetOpen) closeSheet(); }; // wybór obrazu z mapy od razu go pokazuje
});
$("styleBtn").onclick = (e) => { e.stopPropagation(); toggleStylePop(!$("stylePop").classList.contains("open")); };
document.addEventListener("click", (e) => { if (!$("stylePop").contains(e.target)) toggleStylePop(false); });
showStyle();
$("flare").onclick = () => triggerFlare(mode === "storm" ? 4 : 3);
$("toggleSliders").onclick = () => { $("sliders").classList.toggle("open"); syncSliders(); };
canvas.addEventListener("click", (e) => {
  const L = layout();
  if ((vis.style === "bauhaus" || vis.style === "scope") && Math.hypot(e.clientX - L.pulsar.x, e.clientY - L.pulsar.y) < 40) return openSheet();
  if (document.querySelector(".pop.open")) return; // pierwszy klik obok tylko zamyka okienko
  $("panel").classList.toggle("hidden");
});

const SL = [["sWind", "wind", "oWind", 0], ["sDens", "dens", "oDens", 1], ["sBz", "bz", "oBz", 1], ["sKp", "kp", "oKp", 1]];
function syncSliders() { for (const [id, key, out, d] of SL) { $(id).value = target[key]; $(out).textContent = fmt(Number(target[key]), d); } }
for (const [id, key, out, d] of SL) {
  $(id).addEventListener("input", (e) => {
    if (mode !== "manual") {
      mode = "manual"; clearInterval(liveTimer);
      document.querySelectorAll("#modes button").forEach((b) => b.classList.remove("on"));
      showMode(); setStatus();
    }
    target[key] = Number(e.target.value);
    $(out).textContent = fmt(target[key], d);
  });
}

addEventListener("resize", resize);
// Słuchacz dostaje tylko prawdziwe dane. Burza, rozbłysk i suwaki zostają pod ?dev, do dopracowywania obrazu.
document.body.classList.toggle("dev", new URLSearchParams(location.search).has("dev"));
resize();
renderCard();
enterMode("live");
openSheet(); // start od mapy: najpierw wybierasz stację, Play jest w pasku
requestAnimationFrame(frame);
</script>
</body>
</html>
